<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>登顶挑战</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(#dff4ff,#fff);color:#17324d;overflow:hidden}.app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}h1{margin:2px 0 2px;font-size:34px}.tip{font-size:14px;opacity:.65;margin-bottom:4px}.score{font-size:min(25vw,130px);font-weight:900;line-height:1;margin:8px 0}.best{font-weight:700}.stage{width:min(94vw,720px);height:38vh;min-height:240px;position:relative;margin:auto 0 12px}.mountain{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:92%;height:15%;background:linear-gradient(135deg,#7da47d,#315745);clip-path:polygon(50% 0,100% 100%,0 100%);transition:height .22s ease}.climber{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font-size:44px;transition:bottom .22s ease}.buttons{width:min(94vw,720px);display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:0;border-radius:22px;padding:21px 10px;font-size:28px;font-weight:900;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.12);touch-action:manipulation}.btn:active{transform:translateY(3px);box-shadow:0 4px 0 rgba(0,0,0,.12)}#right{background:#2a9d8f}#wrong{background:#e63946}.small{margin-top:12px;border:2px solid #ccd6df;background:#fff;color:#17324d;border-radius:14px;padding:9px 15px;font-weight:700}.msg{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%) scale(.8);background:rgba(0,0,0,.78);color:#fff;padding:16px 24px;border-radius:18px;font-size:30px;font-weight:900;opacity:0;pointer-events:none}.msg.show{animation:pop .7s}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-58%) scale(1)}}
</style>
</head>
<body>
<div class="app">
<h1>🏔️ 登顶挑战</h1>
<div class="tip">答对 +1 · 答错一次立即归零</div>
<div id="score" class="score">0</div>
<div class="best">最高纪录：<span id="best">0</span></div>
<div class="stage"><div id="mountain" class="mountain"></div><div id="climber" class="climber">🧗</div></div>
<div class="buttons"><button id="right" class="btn">✅ 答对 +1</button><button id="wrong" class="btn">❌ 答错归零</button></div>
<button id="reset" class="small">重置最高纪录</button>
</div>
<div id="msg" class="msg"></div>
<script>
(function(){
'use strict';
var n=0,b=Number(localStorage.getItem('mountainBest')||0),score=document.getElementById('score'),best=document.getElementById('best'),mountain=document.getElementById('mountain'),climber=document.getElementById('climber'),msg=document.getElementById('msg');
function draw(){score.textContent=n;best.textContent=b;var p=Math.min(n/30,1),h=15+p*80;mountain.style.height=h+'%';climber.style.bottom=Math.max(8,h-8)+'%';climber.textContent=n>=30?'🏆':'🧗'}
function toast(t){msg.textContent=t;msg.classList.remove('show');void msg.offsetWidth;msg.classList.add('show')}
function add(){n++;if(n>b){b=n;localStorage.setItem('mountainBest',String(b))}draw();if(n===10)toast('10！继续爬 🏔️');if(n===20)toast('20！快到顶了 ❄️');if(n===30)toast('登顶成功！🏆')}
function zero(){if(n>0)toast('归零！💥');n=0;draw()}
document.getElementById('right').addEventListener('click',add,false);document.getElementById('wrong').addEventListener('click',zero,false);document.getElementById('reset').addEventListener('click',function(){n=0;b=0;localStorage.removeItem('mountainBest');draw();toast('已重置')},false);document.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowRight'){e.preventDefault();add()}else if(e.code==='ArrowLeft'||e.code==='Backspace'){e.preventDefault();zero()}},false);draw();
})();
</script>
</body>
</html>
